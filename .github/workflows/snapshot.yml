name: Nightly snapshot

on:
  schedule:
    # 03:23 UTC daily — odd minute to avoid the top-of-hour cron stampede.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted", "pc-gaming"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # build-snapshot.mjs pipes SQL into the sqlite3 CLI. GitHub-hosted
      # images ship it; the PC's WSL runners don't and have no sudo, so stand
      # in with Python's bundled SQLite when it is missing.
      - name: Provide sqlite3
        run: |
          if command -v sqlite3 >/dev/null; then sqlite3 --version; exit 0; fi
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/sqlite3" <<'PY'
          #!/usr/bin/env python3
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          db.executescript(sys.stdin.read())
          db.close()
          PY
          chmod +x "$RUNNER_TEMP/bin/sqlite3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python3 -c 'import sqlite3; print("python sqlite", sqlite3.sqlite_version)'

      - name: Build snapshot
        run: node scripts/build-snapshot.mjs
        env:
          API_BASE: https://c0mm0.com

      - name: Commit and push if changed
        run: |
          git config user.name "commodity-snapshot-bot"
          git config user.email "noreply@c0mm0.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "Snapshot $(date -u +%F)"
            git push
          fi
